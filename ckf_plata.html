<title>CKF PLATA</title>
<style>
:root {
  --bg:      #f2f2f7;
  --card:    #ffffff;
  --text:    #1c1c1e;
  --muted:   #8e8e93;
  --sep:     #e5e5ea;
  --dark:    #1a1a2e;
  --accent:  #e31e24;
  --green:   #34c759;
  --yellow:  #ffd60a;
  --blue:    #007aff;
  --orange:  #F4511E;
  --r:       16px;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); font-weight:500;
  min-height:100dvh;
}

/* ── PIN SCREEN ─────────────────────────────────── */
#pin-screen {
  min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:var(--dark); padding:32px 24px;
}
.pin-logo {
  display:flex; align-items:center; gap:10px; margin-bottom:36px;
}
.pin-logo .name { font-size:28px; font-weight:800; color:#fff; letter-spacing:-.5px; }
.pin-logo .tag {
  background:var(--yellow); color:#1c1c1e; font-size:12px;
  font-weight:800; padding:4px 10px; border-radius:20px; letter-spacing:.5px;
}
.pin-subtitle { color:rgba(255,255,255,.5); font-size:14px; margin-bottom:32px; }
.pin-dots {
  display:flex; gap:14px; margin-bottom:36px;
}
.pin-dot {
  width:16px; height:16px; border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:transparent; transition:background .15s, border-color .15s;
}
.pin-dot.filled { background:#fff; border-color:#fff; }
.pin-keypad {
  display:grid; grid-template-columns:repeat(3,72px); gap:12px;
}
.pin-key {
  height:72px; border-radius:50%; border:none;
  background:rgba(255,255,255,.1); color:#fff;
  font-size:22px; font-weight:600; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:background .12s;
}
.pin-key:active { background:rgba(255,255,255,.25); }
.pin-key .sub { font-size:9px; font-weight:600; letter-spacing:.8px; color:rgba(255,255,255,.5); }
.pin-key.del { background:transparent; font-size:18px; }
.pin-key.ok  { background:var(--accent); }
.pin-key.ok:active { background:#c4181e; }
.pin-error {
  margin-top:20px; color:#ff6b6b; font-size:14px; font-weight:600;
  min-height:20px; text-align:center;
}
.pin-cfg {
  margin-top:32px; color:rgba(255,255,255,.3); font-size:12px;
  cursor:pointer; text-decoration:underline;
}

/* ── MAIN APP ───────────────────────────────────── */
#app-screen { display:none; min-height:100dvh; }

header {
  background:var(--dark); padding:16px 16px 14px;
  position:sticky; top:0; z-index:100;
}
.h-top { display:flex; align-items:center; justify-content:space-between; }
.h-logo { display:flex; align-items:center; gap:8px; }
.h-logo .name { font-size:20px; font-weight:800; color:#fff; letter-spacing:-.5px; }
.h-logo .tag  { background:var(--orange); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; }
.h-user {
  display:flex; align-items:center; gap:8px;
}
.h-username {
  color:rgba(255,255,255,.8); font-size:13px; font-weight:600;
}
.h-logout {
  background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.3);
  color:#fff; font-size:12px; font-weight:600;
  padding:5px 12px; border-radius:20px; cursor:pointer;
}
.h-logout:active { background:rgba(255,255,255,.28); }
.theme-btn {
  background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.3);
  color:#fff; font-size:16px;
  width:32px; height:32px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0;
  flex-shrink:0;
}
.theme-btn:active { background:rgba(255,255,255,.28); }

/* ── DARK THEME ───────────────────────────────────── */
body.dark-theme {
  --bg:   #111118;
  --card: #1c1c28;
  --text: #f2f2f7;
  --sep:  #2a2a3a;
  --blue: #4aabf7;
}
body.dark-theme header { background:#0d0d1a; }

body.dark-theme .pin-card { background:#16162a; color:#f2f2f7; }

body.dark-theme .cal-day { background:#2a2a3a; }

body.dark-theme .cal-day.slobodan{ background:#3a1a1a; }

body.dark-theme .cal-upl  { color:#f2f2f7; }

body.dark-theme .period-tab.active { background:var(--dark); color:#fff; }
body.dark-theme .salary-wrap { background:#111118; }
body.dark-theme .edit-sheet { background:#1c1c28; }
body.dark-theme .edit-title { color:#f2f2f7; }
body.dark-theme .edit-label { color:#8e8e93; }
body.dark-theme .edit-input { background:#2a2a3a; color:#f2f2f7; border-color:#3a3a5a; }
body.dark-theme .smena-btn { background:#2a2a3a; border-color:#3a3a5a; color:#ccc; }
body.dark-theme .smena-btn.active { background:var(--dark); color:#fff; }
body.dark-theme .dug-row { border-color:#2a2a3a; }
body.dark-theme .dug-row.total { background:#2a1a1a; }
body.dark-theme .emp-rows { background:#1c1c28; }
body.dark-theme .emp-row { border-color:#2a2a3a; }
body.dark-theme .salary-row.zaradjeno,
body.dark-theme .salary-row.dug { background:#1a1a2e; }
body.dark-theme .emp-row.zaradjeno,
body.dark-theme .emp-row.dug { background:#1a1a2e; }
body.dark-theme .sheet h3 { color:#f2f2f7; }
body.dark-theme .footer-note { color:#555; }
body.dark-theme .cal-emp-select { background:#2a2a3a; color:#f2f2f7; border-color:#3a3a5a; }

/* ── ACCORDION CALENDAR IN EMP CARD ─────────────── */
.emp-card-header { cursor:pointer; }
.emp-cal-wrap {
  display:none; border-bottom:1px solid var(--sep);
  padding:10px 10px 8px; background:#f8f8fc;
}
@media (max-width: 500px) {

/* ── Calendar ─────────────────────────────────────────── */

<body>

<!-- ═══ PIN SCREEN ═══════════════════════════════════════════════════ -->
<div id="pin-screen">
  <div class="pin-logo">
    <span class="name">CKF</span>
    <span class="tag">PLATA</span>
  </div>
  <p class="pin-subtitle">Unesite vaš PIN za pristup</p>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="keyPress('1')">1</button>
    <button class="pin-key" onclick="keyPress('2')">2<div class="sub">ABC</div></button>
    <button class="pin-key" onclick="keyPress('3')">3<div class="sub">DEF</div></button>
    <button class="pin-key" onclick="keyPress('4')">4<div class="sub">GHI</div></button>
    <button class="pin-key" onclick="keyPress('5')">5<div class="sub">JKL</div></button>
    <button class="pin-key" onclick="keyPress('6')">6<div class="sub">MNO</div></button>
    <button class="pin-key" onclick="keyPress('7')">7<div class="sub">PQRS</div></button>
    <button class="pin-key" onclick="keyPress('8')">8<div class="sub">TUV</div></button>
    <button class="pin-key" onclick="keyPress('9')">9<div class="sub">WXYZ</div></button>
    <button class="pin-key del" onclick="keyDel()">⌫</button>
    <button class="pin-key" onclick="keyPress('0')">0</button>
    <button class="pin-key ok" onclick="keySubmit()">OK</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <span class="pin-cfg" onclick="showCfg()">⚙ Podešavanja</span>
</div>

<!-- ═══ APP SCREEN ════════════════════════════════════════════════════ -->
<div id="app-screen">
  <header>
    <div class="h-top">
      <div class="h-logo">
        <span class="name">CKF</span>
        <span class="tag">PLATA</span>
      </div>
      <div class="h-user">
        <span class="h-username" id="h-username"></span>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
        <button class="h-logout" onclick="logout()">IZLAZ</button>
      </div>
    </div>
  </header>

  <div id="calendar-wrap"></div>
  <div class="period-tabs" id="period-tabs"></div>
  <div class="salary-wrap" id="salary-wrap"></div>

</div>

<!-- ═══ CFG MODAL ═════════════════════════════════════════════════════ -->
<div class="overlay" id="modal-cfg" onclick="bgClose(event,'modal-cfg')">
  <div class="sheet">
    <h3>⚙ Podešavanja</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:8px">Apps Script URL:</p>
    <input class="add-input" type="url" id="cfg-url" placeholder="https://script.google.com/...">
    <div class="modal-btns">
      <button class="mbtn cancel" onclick="hideCfg()">Otkaži</button>
      <button class="mbtn save" onclick="saveCfg()">Sačuvaj</button>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────
let customUrl = localStorage.getItem("ckfPlataUrl") || "https://script.google.com/macros/s/AKfycbznMuXVkU2RfNo34296i5XfV0Kkp9oMlEIskUKgCd3sq66trfNzxgn7VyrVAuWnXr8f/exec";
let currentPin = "";
let employeeData = null; // { radnik, position, records: [...] }
let activePeriod = "";
let currentPosition = "worker";

// ─── THEME ───────────────────────────────────────────────────────────
(function initTheme() {
  if (localStorage.getItem("ckfTheme") === "dark") {
    document.body.classList.add("dark-theme");
    const btn = document.getElementById("theme-btn");
    if (btn) btn.textContent = "☀️";
  }
})();

function toggleTheme() {
  const isDark = document.body.classList.toggle("dark-theme");
  document.getElementById("theme-btn").textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("ckfTheme", isDark ? "dark" : "light");
}

// ─── PIN LOGIC ───────────────────────────────────────────────────────
let pinValue = "";

function keyPress(d) {
  if (pinValue.length >= 4) return;
  pinValue += d;
  updateDots();
  if (pinValue.length === 4) setTimeout(keySubmit, 120);
}
function keyDel() {
  pinValue = pinValue.slice(0, -1);
  updateDots();
  setError("");
}
function updateDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById("d" + i).classList.toggle("filled", i < pinValue.length);
  }
}
function setError(msg) {
  document.getElementById("pin-error").textContent = msg;
}

async function keySubmit() {
  if (pinValue.length < 4) { setError("Unesite 4-cifreni PIN"); return; }
  if (!customUrl) { showCfg(); setError("Prvo unesite Apps Script URL"); return; }

  setError("Provjera...");
  try {
    const res = await fetch(customUrl + "?pin=" + encodeURIComponent(pinValue) + "&ts=" + Date.now(), { cache:"no-store" });
    const data = await res.json();
    if (data.error) { setError(data.error); pinValue = ""; updateDots(); return; }
    employeeData = data;
    currentPin = pinValue;
    showApp();
  } catch(e) {
    setError("Greška veze. Provjerite URL.");
    pinValue = ""; updateDots();
  }
}

// ─── APP ─────────────────────────────────────────────────────────────
function showApp() {
  document.getElementById("pin-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";

  currentPosition = (employeeData.position || "worker").toLowerCase();
  document.getElementById("h-username").textContent = employeeData.radnik || "Radnik";

  const records = employeeData.records || [];

  if (currentPosition === "worker") {
    // Worker sees only own salary card
    renderTabs(records);
    if (records.length > 0) {
      activePeriod = records[0].period;
      renderPeriodTab(activePeriod);
    } else {
      document.getElementById("salary-wrap").innerHTML =
        '<div class="state-msg"><span class="ico">📋</span>Nema podataka za prikaz</div>';
    }
  } else {
    // Admin / Owner — see all employees
    const periods = [...new Set(records.map(r => r.period))]
      .sort((a, b) => String(b).localeCompare(String(a)));
    renderTabsAdmin(periods);
    if (periods.length > 0) {
      activePeriod = periods[0];
      renderPeriodAdmin(activePeriod);
    } else {
      document.getElementById("salary-wrap").innerHTML =
        '<div class="state-msg"><span class="ico">📋</span>Nema podataka za prikaz</div>';
    }
  }

  // Calendar: worker sees own at top; admin/owner use per-card accordion
  if (currentPosition === "worker") {
    fetchCalendar(calendarEmployee || "");
  } else {
    document.getElementById("calendar-wrap").innerHTML = "";
  }
}


function renderTabs(records) {
  const tabs = document.getElementById("period-tabs");
  tabs.innerHTML = "";
  records.forEach((r, i) => {
    const btn = document.createElement("button");
    btn.className = "period-tab" + (i === 0 ? " active" : "");
    btn.textContent = formatPeriod(r.period);
    btn.onclick = () => {
      document.querySelectorAll(".period-tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      activePeriod = r.period;
      renderPeriodTab(r.period);
    };
    tabs.appendChild(btn);
  });
}

// ─── ADMIN TABS ───────────────────────────────────────────────────────
function renderTabsAdmin(periods) {
  const tabs = document.getElementById("period-tabs");
  tabs.innerHTML = "";
  periods.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "period-tab" + (i === 0 ? " active" : "");
    btn.textContent = formatPeriod(p);
    btn.onclick = () => {
      document.querySelectorAll(".period-tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      activePeriod = p;
      renderPeriodAdmin(p);
    };
    tabs.appendChild(btn);
  });
}

// ─── ADMIN / OWNER PERIOD VIEW ───────────────────────────────────────
function renderPeriodAdmin(period) {
  // Server already excluded self — recs = other employees only
  const recs = (employeeData.records || []).filter(r => r.period === period);
  const wrap = document.getElementById("salary-wrap");

  if (recs.length === 0) {
    wrap.innerHTML = '<div class="state-msg"><span class="ico">📋</span>NEMA PODATAKA ZA PRIKAZ</div>';
    return;
  }

  const BADGE_MAP = { administrator: "administrator", owner: "owner", worker: "worker" };
  let html = '<div class="admin-wrap">';

  for (const rec of recs) {
    const dug    = parseFloat(rec.DUG) || 0;   // только из таблицы, без расчётов
    const isPaid = dug <= 0;
    const posKey = (rec.position || "worker").toLowerCase();
    const badgeClass = "badge-" + (BADGE_MAP[posKey] || "worker");

    const empId = (rec.radnik || "").replace(/\s+/g, "_");
    html += `
    <div class="emp-card">
      <div class="emp-card-header" onclick="toggleEmpCalendar('${(rec.radnik || "").replace(/'/g, "\\'")}')">
        <span class="emp-card-name">${rec.radnik || "—"}</span>
        <span class="emp-card-badge ${badgeClass}">${posKey.toUpperCase()}</span>
      </div>
      <div class="emp-cal-wrap" id="ecal-${empId}"></div>
      <div class="emp-rows">
        ${rec.PLATA ? `<div class="emp-row">
          <span class="er-label">PLATA</span>
          <span class="er-val">${fmt(rec.PLATA)} €</span>
        </div>` : ""}
        ${rec.satnica ? `<div class="emp-row">
          <span class="er-label">SATNICA</span>
          <span class="er-val">${rec.satnica}</span>
        </div>` : ""}
        ${rec.ODRADJENO ? `<div class="emp-row">
          <span class="er-label">ODRADJENO</span>
          <span class="er-val">${fmt(rec.ODRADJENO)} H</span>
        </div>` : ""}
        <div class="emp-row zaradjeno">
          <span class="er-label">ZARADJENO</span>
          <span class="er-val">${fmt(rec.ZARADJENO)} €</span>
        </div>
        <div class="emp-row">
          <span class="er-label">UPLACENO</span>
          <span class="er-val">${fmt(rec.UPLACENO)} €</span>
        </div>
        <div class="emp-row dug ${isPaid ? "paid" : ""}">
          <span class="er-label">DUG</span>
          <span class="er-val">${fmt(Math.abs(dug))} €</span>
        </div>
        ${rec.GODISNJI ? `<div class="emp-row godisnji">
          <span class="er-label">GODISNJI</span>
          <span class="er-val">${fmt(rec.GODISNJI)} €</span>
        </div>` : ""}
      </div>
    </div>`;
  }

  // ── DUGOVI ZA PLATU table ──────────────────────────────────────
  const totD = recs.reduce((s, r) => s + (parseFloat(r.DUG) || 0), 0);

  html += `<div class="dug-table">
    <div class="dug-table-hdr">DUGOVI ZA PLATU</div>`;

  for (const rec of recs) {
    const d = parseFloat(rec.DUG) || 0;
    if (d > 0) {
      html += `<div class="dug-row">
        <span class="dr-name">${rec.radnik}</span>
        <span class="dr-val">${fmt(d)} €</span>
      </div>`;
    }
  }

  html += `<div class="dug-row total">
    <span class="dr-name">UKUPNO</span>
    <span class="dr-val">${fmt(totD)} €</span>
  </div></div>`;

  html += '</div>';
  wrap.innerHTML = html;
}

// ─── WORKER PERIOD VIEW ───────────────────────────────────────────────
function renderPeriodTab(period) {
  const rec = (employeeData.records || []).find(r => r.period === period);
  if (!rec) return;
  const wrap = document.getElementById("salary-wrap");

  const dug    = parseFloat(rec.DUG) || 0;   // только из таблицы, без расчётов
  const isPaid = dug <= 0;

  wrap.innerHTML = `
    <div class="salary-card">
      <div class="salary-header">
        <div class="salary-period">${formatPeriod(period)}</div>
        <div class="salary-name">${employeeData.radnik || ""}</div>
      </div>
      <div class="salary-rows">
        <div class="salary-row">
          <span class="sr-label">PLATA</span>
          <span class="sr-val">${fmt(rec.PLATA)} €</span>
        </div>
        <div class="salary-row">
          <span class="sr-label">SATNICA</span>
          <span class="sr-val">${rec.satnica || "–"}</span>
        </div>
        <div class="salary-row">
          <span class="sr-label">ODRADJENO</span>
          <span class="sr-val">${rec.ODRADJENO > 0 ? fmt(rec.ODRADJENO) + " H" : "–"}</span>
        </div>
        <div class="salary-row zaradjeno">
          <span class="sr-label">ZARADJENO</span>
          <span class="sr-val">${fmt(rec.ZARADJENO)} €</span>
        </div>
        <div class="salary-row">
          <span class="sr-label">UPLACENO</span>
          <span class="sr-val">${fmt(rec.UPLACENO)} €</span>
        </div>
        <div class="salary-row dug ${isPaid ? 'paid' : ''}">
          <span class="sr-label">DUG</span>
          <span class="sr-val">${fmt(Math.abs(dug))} €</span>
        </div>
      </div>
    </div>`;
}

function fmt(v) {
  if (v === undefined || v === null || v === "") return "–";
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toLocaleString("sr-RS", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatPeriod(p) {
  if (!p) return p;
  const months = ["Jan","Feb","Mar","Apr","Maj","Jun","Jul","Avg","Sep","Okt","Nov","Dec"];
  const parts = String(p).split("-");
  if (parts.length === 2) {
    const m = parseInt(parts[1], 10);
    return months[m - 1] + " " + parts[0];
  }
  return p;
}

function logout() {
  employeeData = null;
  pinValue = ""; updateDots(); setError("");
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("pin-screen").style.display = "flex";
}

// ─── CONFIG ──────────────────────────────────────────────────────────

// ─── CALENDAR ─────────────────────────────────────────────────────────
let calendarEmployee = "";   // currently displayed employee name

// ── Accordion calendar per employee card (admin / owner) ─────────────
const empCalCache = {};

function toggleEmpCalendar(empName) {
  const id = "ecal-" + empName.replace(/\s+/g, "_");
  const wrap = document.getElementById(id);
  if (!wrap) return;

  // toggle collapse
  if (wrap.classList.contains("open")) {
    wrap.classList.remove("open");
    return;
  }
  wrap.classList.add("open");

  // already loaded for this period? reuse
  const cacheKey = empName + "|" + activePeriod;
  if (empCalCache[cacheKey]) {
    renderCalendarInCard(empCalCache[cacheKey], wrap, currentPosition === "administrator");
    return;
  }

  wrap.innerHTML = '<div class="cal-loading">⏳ Učitavanje…</div>';
  const isEditable = currentPosition === "administrator";

  fetch(customUrl + "?action=calendar&pin=" + encodeURIComponent(currentPin)
    + "&target=" + encodeURIComponent(empName)
    + "&ts=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      empCalCache[cacheKey] = data;
      if (wrap.classList.contains("open")) {
        renderCalendarInCard(data, wrap, isEditable);
      }
    })
    .catch(() => {
      wrap.innerHTML = '<div class="cal-loading">❌ Greška pri učitavanju</div>';
    });
}

function renderCalendarInCard(data, wrap, isEditable) {
  const days     = data.days     || [];
  const month    = data.month    || "";
  const employee = data.employee || "";

  let html = '<div class="cal-title">📅 ' + month + '</div>';

  const DOW = ["PON","UTO","SRE","ČET","PET","SUB","NED"];
  html += '<div class="cal-grid">';
  DOW.forEach(d => { html += '<div class="cal-dow">' + d + '</div>'; });

  const DOW_MAP = { PON:0, UTO:1, SRE:2, "ČET":3, CET:3, PET:4, SUB:5, NED:6 };
  let offset = 0;
  if (days.length > 0) {
    const firstName = (days[0].name || "").replace(/\d/g, "").trim().toUpperCase();
    offset = DOW_MAP[firstName] !== undefined ? DOW_MAP[firstName] : 0;
  }
  for (let i = 0; i < offset; i++) {
    html += '<div class="cal-day empty"></div>';
  }

  days.forEach(day => {
    const smena = String(day.smena || "").trim().toUpperCase();
    const hours = day.hours || 0;
    let cls = "cal-day";
    if      (smena === "P") cls += " smena1";
    else if (smena === "D") cls += " smena2";
    else if (smena === "B") cls += " bolestan";
    else if (smena === "S") cls += " slobodan";

    let inner = '<span class="cal-num">' + day.num + '</span>';
    inner += '<span class="cal-smena-badge">' + (smena || "") + '</span>';
    inner += hours > 0
      ? '<span class="cal-hrs">' + hours + 'h</span>'
      : '<span class="cal-hrs"></span>';
    const upl = day.upl || 0;
    inner += upl > 0
      ? '<span class="cal-upl">' + Math.round(upl).toLocaleString("de-DE") + '</span>'
      : '<span class="cal-upl"></span>';
    const god = day.god || 0;
    if (god > 0) {
      inner += '<span class="cal-god">' + Math.round(god).toLocaleString("de-DE") + '</span>';
    }

    const dataAttrs = isEditable
      ? ` data-day="${day.num}" data-smena="${smena}" data-hours="${hours}" data-upl="${day.upl || 0}"`
      : "";
    const cursor = isEditable ? ' style="cursor:pointer"' : "";
    html += '<div class="' + cls + '"' + dataAttrs + cursor + '>' + inner + '</div>';
  });

  html += '</div>';
  wrap.innerHTML = html;

  if (isEditable) {
    calendarEmployee = employee;
    wrap.querySelectorAll(".cal-day[data-day]").forEach(cell => {
      cell.addEventListener("click", () => {
        openEditModal(
          parseInt(cell.dataset.day),
          cell.dataset.smena || "",
          parseFloat(cell.dataset.hours) || 0,
          parseFloat(cell.dataset.upl) || 0
        );
      });
    });
  }
}

async function fetchCalendar(targetName) {
  const wrap = document.getElementById("calendar-wrap");
  if (!wrap) return;
  wrap.innerHTML = '<div class="cal-loading">⏳ Učitavanje rasporeda…</div>';

  const target = targetName || "";
  try {
    const url = customUrl +
      "?action=calendar&pin=" + encodeURIComponent(currentPin) +
      (target ? "&target=" + encodeURIComponent(target) : "") +
      "&ts=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    const data = await res.json();
    if (data.error && !data.days) {
      wrap.innerHTML = '<div class="cal-loading">📅 ' + data.error + '</div>';
      return;
    }
    renderCalendar(data);
  } catch(e) {
    wrap.innerHTML = '<div class="cal-loading">❌ Greška rasporeda</div>';
  }
}

function renderCalendar(data) {
  const wrap = document.getElementById("calendar-wrap");
  if (!wrap) return;

  const days      = data.days      || [];
  const month     = data.month     || "";
  const employee  = data.employee  || "";
  const employees = data.employees || [];
  calendarEmployee = employee;

  // ── Header ─────────────────────────────────────────────────────────
  let headerHTML = '<div class="cal-header">';
  headerHTML += '<span class="cal-title">📅 ' + month + '</span>';

  if (employees.length > 0) {
    headerHTML += '<select class="cal-emp-select" onchange="fetchCalendar(this.value)">';
    employees.forEach(name => {
      const sel = name === employee ? ' selected' : '';
      headerHTML += '<option value="' + name + '"' + sel + '>' + name + '</option>';
    });
    headerHTML += '</select>';
  }
  headerHTML += '</div>';

  // ── Day-of-week headers ────────────────────────────────────────────
  const DOW = ["PON","UTO","SRE","ČET","PET","SUB","NED"];
  let gridHTML = '<div class="cal-grid">';
  DOW.forEach(d => { gridHTML += '<div class="cal-dow">' + d + '</div>'; });

  const DOW_MAP = { PON:0, UTO:1, SRE:2, "ČET":3, CET:3, PET:4, SUB:5, NED:6 };
  let offset = 0;
  if (days.length > 0) {
    const firstName = (days[0].name || "").replace(/\d/g, "").trim().toUpperCase();
    offset = DOW_MAP[firstName] !== undefined ? DOW_MAP[firstName] : 0;
  }
  for (let i = 0; i < offset; i++) {
    gridHTML += '<div class="cal-day empty"></div>';
  }

  days.forEach(day => {
    const smena = String(day.smena || "").trim().toUpperCase();
    const hours = day.hours || 0;
    let cls = "cal-day";
    if      (smena === "P")  cls += " smena1";
    else if (smena === "D")  cls += " smena2";
    else if (smena === "B")  cls += " bolestan";
    else if (smena === "S")  cls += " slobodan";

    let inner = '<span class="cal-num">' + day.num + '</span>';
    inner += '<span class="cal-smena-badge">' + (smena || '') + '</span>';
    if (hours > 0) {
      inner += '<span class="cal-hrs">' + hours + 'h</span>';
    } else {
      inner += '<span class="cal-hrs"></span>';
    }
    const upl = day.upl || 0;
    if (upl > 0) {
      inner += '<span class="cal-upl">' + Math.round(upl).toLocaleString("de-DE") + '</span>';
    } else {
      inner += '<span class="cal-upl"></span>';
    }
    const god = day.god || 0;
    if (god > 0) {
      inner += '<span class="cal-god">' + Math.round(god).toLocaleString("de-DE") + '</span>';
    }

    const isAdmin = currentPosition === "administrator";
    if (isAdmin) {
      gridHTML += '<div class="' + cls + '" data-day="' + day.num + '" data-smena="' + smena + '" data-hours="' + hours + '" data-upl="' + (day.upl||0) + '">' + inner + '</div>';
    } else {
      gridHTML += '<div class="' + cls + '">' + inner + '</div>';
    }
  });

  gridHTML += '</div>';
  wrap.innerHTML = headerHTML + gridHTML;

  if (currentPosition === "administrator") {
    wrap.querySelectorAll(".cal-day[data-day]").forEach(cell => {
      cell.addEventListener("click", () => {
        openEditModal(
          parseInt(cell.dataset.day),
          cell.dataset.smena || "",
          parseFloat(cell.dataset.hours) || 0,
          parseFloat(cell.dataset.upl) || 0
        );
      });
    });
  }
}

// ─── EDIT MODAL ────────────────────────────────────────────────────────
let editDayNum = 0;
let editSmena  = "";

function openEditModal(dayNum, smena, hours, upl) {
  if (currentPosition !== "administrator") return;
  editDayNum = dayNum;
  editSmena  = smena;

  document.getElementById("edit-title").textContent =
    (calendarEmployee || "") + " — день " + dayNum;
  document.getElementById("edit-hours").value = hours > 0 ? hours : "";
  document.getElementById("edit-upl").value   = upl   > 0 ? upl   : "";

  ["P","D","B","S",""].forEach(v => {
    const btn = document.getElementById("sb-" + v);
    if (btn) btn.className = "smena-btn" + (v === editSmena ? " active-" + v : "");
  });

  document.getElementById("edit-overlay").classList.add("show");
}

function closeEditModal(e) {
  if (e && e.target !== document.getElementById("edit-overlay")) return;
  document.getElementById("edit-overlay").classList.remove("show");
}

function pickSmena(v) {
  editSmena = v;
  ["P","D","B","S",""].forEach(s => {
    const btn = document.getElementById("sb-" + s);
    if (btn) btn.className = "smena-btn" + (s === v ? " active-" + s : "");
  });
}

async function saveDay() {
  const hours = document.getElementById("edit-hours").value.trim();
  const upl   = document.getElementById("edit-upl").value.trim();
  const btn   = document.getElementById("edit-save-btn");

  btn.textContent = "Čuvanje…";
  btn.classList.add("edit-saving");

  try {
    const url = customUrl +
      "?action=save" +
      "&pin="      + encodeURIComponent(currentPin) +
      "&target="   + encodeURIComponent(calendarEmployee) +
      "&day="      + editDayNum +
      "&smena="    + encodeURIComponent(editSmena) +
      "&hours="    + encodeURIComponent(hours) +
      "&upl="      + encodeURIComponent(upl) +
      "&ts="       + Date.now();

    const res  = await fetch(url, { cache: "no-store" });
    const data = await res.json();

    if (data.error) {
      alert("Greška: " + data.error);
    } else {
      document.getElementById("edit-overlay").classList.remove("show");
      if (currentPosition === "administrator") {
        delete empCalCache[calendarEmployee + "|" + activePeriod];
        fetch(customUrl + "?action=calendar&pin=" + encodeURIComponent(currentPin)
          + "&target=" + encodeURIComponent(calendarEmployee)
          + "&ts=" + Date.now(), { cache: "no-store" })
          .then(r => r.json())
          .then(d => {
            empCalCache[calendarEmployee + "|" + activePeriod] = d;
            const w = document.getElementById("ecal-" + calendarEmployee.replace(/\s+/g, "_"));
            if (w && w.classList.contains("open")) renderCalendarInCard(d, w, true);
          }).catch(() => {});
      } else {
        fetchCalendar(calendarEmployee);
      }
    }
  } catch(err) {
    alert("Greška veze");
  } finally {
    btn.textContent = "Sačuvaj";
    btn.classList.remove("edit-saving");
  }
}

function showCfg() {
  document.getElementById("modal-cfg").classList.add("show");
  document.getElementById("cfg-url").value = customUrl;
}
function hideCfg() { document.getElementById("modal-cfg").classList.remove("show"); }
function saveCfg() {
  const val = document.getElementById("cfg-url").value.trim();
  if (val) { customUrl = val; localStorage.setItem("ckfPlataUrl", val); }
  hideCfg();
}
function bgClose(e, id) {
  if (e.target.id === id) document.getElementById(id).classList.remove("show");
}
</script>
